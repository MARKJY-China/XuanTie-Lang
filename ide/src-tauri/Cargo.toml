[package]
name = "xuantie-foundry"
version = "0.3.1"
description = "玄铁铸造厂 — XuanTieLang IDE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
futures = "0.3"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["process", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

# 发行构建必须启用(内嵌前端资源):cargo build --release --features custom-protocol
# 不带它编出的 release 是"开发壳"(去连 localhost:5173),禁止分发
[features]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
strip = true
lto = true
