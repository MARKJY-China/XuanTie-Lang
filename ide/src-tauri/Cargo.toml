[package]
name = "xuantie-foundry"
version = "0.2.0"
description = "玄铁铸造厂 —— 玄铁语言 IDE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"

# 发行构建必须启用(内嵌前端资源):cargo build --release --features custom-protocol
# 不带它编出的 release 是"开发壳"(去连 localhost:5173),禁止分发
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
