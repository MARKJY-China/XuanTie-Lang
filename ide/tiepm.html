<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铁铺 · 安装与搜索</title>
  <style>
    /* 独立窗口:不加载主界面样式表,自带一套主题(与 IDE 暗色一致,跟随系统亮色) */
    :root {
      --bg: #1e1e1e;
      --bg-panel: #252526;
      --bg-deep: #181818;
      --bg-hover: #2a2d2e;
      --border: #3c3c3c;
      --fg: #d4d4d4;
      --fg-dim: #9d9d9d;
      --accent: #e8842c;
      --accent-dim: #a05a1e;
      --ok: #4ec9b0;
      --warn: #cca700;
      --err: #f14c4c;
      --mono: "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
      color-scheme: dark;
    }
    html.light {
      --bg: #eef1f4;
      --bg-panel: #f7f8fa;
      --bg-deep: #ffffff;
      --bg-hover: #e3e7eb;
      --border: #c9d1d9;
      --fg: #1f2328;
      --fg-dim: #57606a;
      --accent: #c2410c;
      --accent-dim: #b45309;
      --ok: #1a7f5a;
      --warn: #9a6700;
      --err: #c62828;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; gap: 0;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, "Microsoft YaHei UI", sans-serif; font-size: 12.5px;
    }
    #bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
    #q {
      flex: 1; min-width: 120px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); padding: 5px 10px; font-size: 13px; outline: none;
    }
    #q:focus { border-color: var(--accent-dim); }
    .btn {
      padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 12px; font-family: inherit;
      white-space: nowrap;
    }
    .btn:hover { color: var(--fg); border-color: var(--fg-dim); }
    .btn.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
    .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
    #hint { padding: 6px 12px; color: var(--fg-dim); font-size: 12px; min-height: 26px; }
    #hint.err { color: var(--err); }
    #hint.ok { color: var(--ok); }
    #list { flex: 1; overflow-y: auto; padding: 2px 12px 10px; }
    .row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border: 1px solid transparent; border-radius: 6px;
    }
    .row:hover { background: var(--bg-hover); border-color: var(--border); }
    .row .nm { font-weight: 600; flex-shrink: 0; }
    .row .ver {
      font-size: 11.5px; color: var(--fg-dim); flex-shrink: 0;
      background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px;
    }
    .row .ver.on { color: var(--ok); border-color: var(--ok); }
    .row .desc { flex: 1; min-width: 0; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .act { flex-shrink: 0; }
    .empty { color: var(--fg-dim); padding: 18px 10px; }
    #logwrap { border-top: 1px solid var(--border); background: var(--bg-deep); }
    #loghead { display: flex; align-items: center; gap: 8px; padding: 5px 12px; color: var(--fg-dim); font-size: 12px; }
    #loghead .spacer { flex: 1; }
    #log {
      height: 180px; overflow-y: auto; margin: 0; padding: 4px 12px 10px;
      font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-all;
      color: var(--fg);
    }
    #log .err { color: var(--err); }
    #log .ok { color: var(--ok); }
    #log .dim { color: var(--fg-dim); }
  </style>
</head>
<body>
  <div id="bar">
    <input id="q" type="text" placeholder="搜索铁器（包名或简介）…" spellcheck="false" />
    <button class="btn" id="btn-search">搜索</button>
    <button class="btn primary" id="btn-install">安装</button>
    <button class="btn" id="btn-refresh" title="重新读取已安装列表">刷新</button>
  </div>
  <div id="hint">正在读取铁铺…</div>
  <div id="list"></div>
  <div id="logwrap">
    <div id="loghead">
      <span id="log-status">安装输出</span>
      <span class="spacer"></span>
      <button class="btn" id="btn-cancel" disabled>取消安装</button>
    </div>
    <pre id="log"></pre>
  </div>
  <script type="module" src="/src/tiepm/window.ts"></script>
</body>
</html>
