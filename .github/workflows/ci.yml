# 本工作流是《docs/CI落地方案.md》P0 阶段的落地件：把"判定依据"（回归 runner + 基线 + 自举固定点比对）接成机器门禁。
# 门禁判据：编译成功性 / 退出码 / FAIL 标记 / 与 Test/golden 基线逐行 diff（四层），叠加自举 s3==s4 逐字节一致（DDC）。
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 准备工具链(clang / MinGW gcc)
        shell: bash
        run: |
          set -e
          # clang:windows-latest 镜像通常已带 LLVM(不在 PATH 则补 PATH);缺失则 choco 安装
          if ! command -v clang >/dev/null 2>&1; then
            if [ ! -f "/c/Program Files/LLVM/bin/clang.exe" ]; then
              choco install llvm -y --no-progress
            fi
            echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
            export PATH="/c/Program Files/LLVM/bin:$PATH"
          fi
          # MinGW gcc:镜像不含,choco 安装(装完 choco 的 bin 目录在 PATH 上,gcc shim 即可用;
          # 链接阶段由玄铁编译器按 PATH 调用 gcc)
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw -y --no-progress
          fi
          echo "=== 工具链版本 ==="
          clang --version || true
          gcc --version || true

      - name: 构建种子编译器 GSC
        run: go build -o xt_gsc.exe .

      - name: 自举链 + DDC 门禁(s1→s4,固定点 s3==s4)
        shell: bash
        run: bash tools/bootstrap_check.sh

      - name: 语法着色自检(TextMate 规则边界,防「是否完成」类标识符被劈开)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --quiet regex
          python tools/check_grammar.py

      - name: 铁铺包同步(渲染/UI 以裸名解析依赖此目录)
        shell: bash
        run: |
          set -e
          DEST="$USERPROFILE/.tiepm/已安装"
          mkdir -p "$DEST/渲染" "$DEST/UI"
          cp -rf lib/渲染/. "$DEST/渲染/"
          cp -rf lib/UI/.   "$DEST/UI/"
          ls "$DEST/渲染" | head -5
          ls "$DEST/UI" | head -5

      - name: "铁铺 CLI 冒烟(issue #49:构建 + lc 硬判 + ql)"
        shell: bash
        run: |
          set -e
          ./build/xtc_s4.exe 铁 tiepm/铁铺.xt -sc tiepm_smoke.exe
          ./tiepm_smoke.exe lc | tee tiepm_lc.log
          grep -q "已安装的铁器" tiepm_lc.log
          grep -q "玄铁内置" tiepm_lc.log
          ./tiepm_smoke.exe ql
          rm -f tiepm_smoke.exe tiepm_lc.log

      - name: 全量回归(跳过 96/97/98 弹窗类:CI 无显示服务; 跳过 77 压力对抗:低核 runner 上机器相关耗时 >300s)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python tools/regress.py --xtc build/xtc_s4.exe --skip 96_,97_,98_,77_

      - name: 失败时上传回归日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: |
            temp/regression_logs/
            temp/_bootstrap_scratch/
          if-no-files-found: ignore

  # darwin 门禁:补上 macOS arm64 的链接路径覆盖 —— issue #41(darwin 自举链接失败)正是"上游 CI 全绿
  # 而 darwin 侧断链"的漏洞。跑同一条 tools/bootstrap_check.sh:构建链路与两段冒烟硬判;DDC 在 darwin
  # 上因 ld64 每次链接注入随机 LC_UUID、叠加 -g 的 DWARF 调试段不确定(实测 s3/s4 差 200 字节)无法逐字节
  # 比对,脚本会自动转入"IR 补判":s3/s4 各编同一 fixture 并用 -bl 保留中间产物,逐字节比对编译器自己
  # 生成的 IR(不含链接器注入项),IR 不一致即硬失败。
  gate-darwin:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 工具链与系统版本
        run: |
          clang --version | head -2
          gcc --version | head -1
          sw_vers

      - name: 构建种子编译器 GSC
        run: go build -o xt_gsc.exe .

      - name: 自举链 + DDC 门禁(darwin:链接器差异隔离为 IR 补判)
        shell: bash
        run: bash tools/bootstrap_check.sh

      - name: "铁铺 CLI 冒烟(issue #49:POSIX 分支真跑一次——构建 + lc 硬判 + ql)"
        shell: bash
        run: |
          set -e
          ./build/xtc_s4.exe 铁 tiepm/铁铺.xt -sc tiepm_smoke.exe
          ./tiepm_smoke.exe lc | tee tiepm_lc.log
          grep -q "已安装的铁器" tiepm_lc.log
          grep -q "玄铁内置" tiepm_lc.log
          ./tiepm_smoke.exe ql
          rm -f tiepm_smoke.exe tiepm_lc.log

      - name: "TLS 冒烟(issue #51:darwin 编译版 求() 走系统原生 SecureTransport)"
        shell: bash
        run: |
          set -e
          cat > /tmp/tls_smoke.xt <<'XTEOF'
          设 响 = 求("https://example.com/")
          若 响.成功 {
              若 响.值.包含?("Example Domain") { 示("TLS 正例 PASS") } 否 { 示("TLS 正例 FAIL: 正文异常"); 终 1 }
          } 否 {
              示("TLS 正例 FAIL: " & 响.错误); 终 1
          }
          设 坏 = 求("https://wrong.host.badssl.com/")
          设 被拒 = 非 坏.成功 或 坏.值.包含?("TLS 握手失败")
          若 被拒 {
              示("TLS 反例 PASS: 证书与主机名不符已被拒绝")
          } 否 {
              示("TLS 反例 FAIL: 证书与主机名不符竟被接受(校验缺失,安全缺陷)"); 终 1
          }
          XTEOF
          ./build/xtc_s4.exe 铁 /tmp/tls_smoke.xt -sc /tmp/tls_smoke_exe
          /tmp/tls_smoke_exe

      - name: 失败时上传自举日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-darwin
          path: temp/_bootstrap_scratch/
          if-no-files-found: ignore

  # Linux 门禁:编译器有 linux 目标、运行时/铁铺有 POSIX 分支,此前从未在 Linux 上跑过。
  # linux 上 DDC 为硬判(逐字节一致),与 Windows 同口径;POSIX 与 darwin 共享大部分分支,
  # Linux 专属(sha256sum、GNU tar、glibc 环境)由此覆盖。
  gate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 工具链与系统版本
        run: |
          clang --version | head -2
          gcc --version | head -1
          uname -a

      - name: 构建种子编译器 GSC
        run: go build -o xt_gsc.exe .

      - name: 自举链 + DDC 门禁(linux:硬判逐字节一致)
        shell: bash
        run: bash tools/bootstrap_check.sh

      - name: "铁铺 CLI 冒烟(issue #49:POSIX 分支——含 Linux 专属 sha256sum 取哈希通道)"
        shell: bash
        run: |
          set -e
          ./build/xtc_s4.exe 铁 tiepm/铁铺.xt -sc tiepm_smoke
          ./tiepm_smoke lc | tee tiepm_lc.log
          grep -q "已安装的铁器" tiepm_lc.log
          grep -q "玄铁内置" tiepm_lc.log
          ./tiepm_smoke ql
          rm -f tiepm_smoke tiepm_lc.log

      - name: "TLS 存根冒烟(issue #51:linux 无系统 TLS——https 须明确失败而非崩溃/挂死)"
        shell: bash
        run: |
          set -e
          cat > /tmp/tls_stub_smoke.xt <<'XTEOF'
          设 响 = 求("https://example.com/")
          设 被拒 = 非 响.成功 或 响.值.包含?("TLS 握手失败")
          若 被拒 {
              示("TLS 存根 PASS: linux 无系统 TLS 通道,https 明确失败")
          } 否 {
              示("TLS 存根 FAIL: linux 无 TLS 通道,https 竟取回结果"); 终 1
          }
          XTEOF
          ./build/xtc_s4.exe 铁 /tmp/tls_stub_smoke.xt -sc /tmp/tls_stub_smoke
          /tmp/tls_stub_smoke

      - name: 失败时上传自举日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-linux
          path: temp/_bootstrap_scratch/
          if-no-files-found: ignore

  # Windows ARM64 门禁:ARM64 自举/架构探测代码此前从未在真 ARM64 硬件上跑过。
  # 关键事实(首跑实测):该 runner 的 shell 工具链是 x64 模拟(Git Bash uname -m=x86_64、
  # PROCESSOR_ARCHITECTURE=AMD64),镜像自带 x64 MinGW 与 LLVM —— 编译器自测会把架构判成
  # amd64。故:① 工具链相关步骤走 MSYS2 CLANGARM64 环境 shell(原生 aarch64 clang/gcc,
  # gcc 由 gcc-compat 提供);② 顶层设 XT_ARCH=arm64 让门禁把运行时 .o 预编译成 arm64 并给
  # 链上各级(GSC/XTC 支持 --架构)显式透传,冒烟编译同样带 --架构。
  gate-win-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      XT_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-gcc-compat

      - name: 工具链自检与别名兜底(CLANGARM64 环境)
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/clangarm64/bin:$PATH"
          echo "MSYSTEM=$MSYSTEM"
          which -a clang gcc | head -6
          clang --version | head -2
          gcc --version | head -2
          BIN=/clangarm64/bin
          # clang 的 MinGW 驱动默认找 ld;CLANGARM64 只有 ld.lld —— 备好别名(存在则跳过)
          if [ ! -f "$BIN/ld.exe" ] && [ -f "$BIN/ld.lld.exe" ]; then
            cp "$BIN/ld.lld.exe" "$BIN/ld.exe"; echo "已备 ld.exe → ld.lld.exe 别名"
          fi
          if [ ! -f "$BIN/gcc.exe" ] && [ -f "$BIN/aarch64-w64-mingw32-gcc.exe" ]; then
            cp "$BIN/aarch64-w64-mingw32-gcc.exe" "$BIN/gcc.exe"; echo "已备 gcc.exe 别名"
          fi
          ls "$BIN" | grep -iE "^(gcc|clang|ld)" | head -8

      - name: 构建种子编译器 GSC
        shell: bash
        run: go build -o xt_gsc.exe .

      - name: 自举链 + DDC 门禁(win-arm64:硬判逐字节一致,XT_ARCH=arm64 显式指定)
        shell: msys2 {0}
        run: |
          export PATH="/clangarm64/bin:$PATH"
          bash tools/bootstrap_check.sh

      - name: 铁铺 CLI 冒烟(Windows 分支在 ARM64 上的回归)
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/clangarm64/bin:$PATH"
          ./build/xtc_s4.exe 铁 tiepm/铁铺.xt --架构 $XT_ARCH -sc tiepm_smoke.exe
          ./tiepm_smoke.exe lc | tee tiepm_lc.log
          grep -q "已安装的铁器" tiepm_lc.log
          grep -q "玄铁内置" tiepm_lc.log
          ./tiepm_smoke.exe ql
          rm -f tiepm_smoke.exe tiepm_lc.log

      - name: TLS 冒烟(Schannel 在 ARM64 上的正/反例,同 darwin 口径)
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/clangarm64/bin:$PATH"
          cat > tls_smoke.xt <<'XTEOF'
          设 响 = 求("https://example.com/")
          若 响.成功 {
              若 响.值.包含?("Example Domain") { 示("TLS 正例 PASS") } 否 { 示("TLS 正例 FAIL: 正文异常"); 终 1 }
          } 否 {
              示("TLS 正例 FAIL: " & 响.错误); 终 1
          }
          设 坏 = 求("https://wrong.host.badssl.com/")
          设 被拒 = 非 坏.成功 或 坏.值.包含?("TLS 握手失败")
          若 被拒 {
              示("TLS 反例 PASS: 证书与主机名不符已被拒绝")
          } 否 {
              示("TLS 反例 FAIL: 证书与主机名不符竟被接受(校验缺失,安全缺陷)"); 终 1
          }
          XTEOF
          ./build/xtc_s4.exe 铁 tls_smoke.xt --架构 $XT_ARCH -sc tls_smoke.exe
          ./tls_smoke.exe
          rm -f tls_smoke.xt tls_smoke.exe

      - name: 失败时上传自举日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-win-arm64
          path: temp/_bootstrap_scratch/
          if-no-files-found: ignore
