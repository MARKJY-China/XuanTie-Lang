name = "Xuantie"
grammar = "xuantie"
path_suffixes = ["xt"]

line_comments = ["//"]
block_comment = ["/* ", " */"]

tab_size = 4
hard_tabs = false

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
